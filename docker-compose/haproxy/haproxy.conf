global
    maxconn 50000
    log stdout format raw local0
    user root
    group root
    nbthread 4
    cpu-map auto:1/1-4 0-3
    ssl-default-bind-options ssl-min-ver TLSv1.1

defaults
    timeout connect 10s
    timeout client 30s
    timeout server 30s
    log global
    mode http
    option httplog
    maxconn 3000
    default_backend no-match

frontend all
    bind 0.0.0.0:80
    bind 0.0.0.0:443 ssl crt /etc/ssl/certs/localhost.tls.pem
    use_backend keycloak-backend if { path_beg /idp }
    use_backend keycloak-backend if { path_beg /.well-known/oauth-authorization-server/idp/realms/uis-issuer-realm }
    use_backend keycloak-backend if { path_beg /.well-known/openid-configuration/idp/realms/uis-issuer-realm }
    use_backend uis-issuer-backend if { path_beg /.well-known/openid-credential-issuer/uis-issuer }
    use_backend uis-issuer-backend if { path_beg /.well-known/oauth-protected-resource/uis-issuer }
    use_backend uis-issuer-backend if { path_beg /.well-known/jwt-vc-issuer/uis-issuer }
    use_backend uis-issuer-metadata if { path /.well-known/jwt-issuer/uis-issuer }
    use_backend uis-issuer-backend if { path_beg /uis-issuer }
    use_backend status-list-backend if { path_beg /token_status_list }

backend keycloak-backend
    balance roundrobin
    cookie SERVERUSED insert indirect nocache
    option forwarded proto host by by_port for
    http-request set-path /idp/realms/uis-issuer-realm/.well-known/oauth-authorization-server if { path_beg /.well-known/oauth-authorization-server/idp/realms/uis-issuer-realm }
    http-request set-path /idp/realms/uis-issuer-realm/.well-known/openid-configuration if { path_beg /.well-known/openid-configuration/idp/realms/uis-issuer-realm }
    server server1 keycloak:8080 cookie server1

backend uis-issuer-metadata
    http-request return status 200 content-type application/json lf-string "{\"issuer\":\"https://civica-desarrollo.avance.org.co/uis-issuer\",\"jwks_uri\":\"https://civica-desarrollo.avance.org.co/uis-issuer/public_keys.jwks\"}"

backend uis-issuer-backend
    balance roundrobin
    cookie SERVERUSED insert indirect nocache
    option forwarded proto host by by_port for
    http-request set-path /uis-issuer/.well-known/openid-credential-issuer if { path_beg /.well-known/openid-credential-issuer/uis-issuer }
    http-request set-path /uis-issuer/.well-known/oauth-protected-resource if { path_beg /.well-known/oauth-protected-resource/uis-issuer }
    http-request set-path /uis-issuer/.well-known/jwt-vc-issuer if { path_beg /.well-known/jwt-vc-issuer/uis-issuer }
    server server1 uis-issuer:8080 cookie server1

backend status-list-backend
    balance roundrobin
    cookie SERVERUSED insert indirect nocache
    option forwarded proto host by by_port for
    server server1 status-list:5000 cookie server1

backend no-match
    http-request deny deny_status 404
