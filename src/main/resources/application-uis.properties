# UIS Academic Issuer Configuration
# Universidad Industrial de Santander - Credenciales Académicas

spring.profiles.active=uis

# Server configuration
server.port=8080

# Issuer public URL
issuer.publicUrl=http://localhost:8080

# Authorization Server (Keycloak)
issuer.authorizationServer.publicUrl=https://civica-desarrollo.avance.org.co/idp/realms/uis-issuer-realm
issuer.authorizationServer.introspection=${issuer.authorizationServer.publicUrl}/protocol/openid-connect/token/introspect

# Keystore configuration
issuer.keystore.file=classpath:issuer-keys.jks
issuer.keystore.type=JKS
issuer.keystore.password=keys

# Credential Request Encryption
issuer.credentialRequestEncryption.supported=true
issuer.credentialRequestEncryption.required=true
issuer.credentialRequestEncryption.jwks.algorithm=ECDH-ES
issuer.credentialRequestEncryption.jwks.alias=request-encryption
issuer.credentialRequestEncryption.jwks.password=request-encryption
issuer.credentialRequestEncryption.encryptionMethods=A128GCM,A256GCM

# Credential Response Encryption
issuer.credentialResponseEncryption.supported=true
issuer.credentialResponseEncryption.required=true
issuer.credentialResponseEncryption.algorithmsSupported=ECDH-ES
issuer.credentialResponseEncryption.encryptionMethods=A128GCM,A256GCM

# Nonce encryption
issuer.nonce.encryption-key.alias=nonce-encryption
issuer.nonce.encryption-key.password=nonce-encryption

# PID Configuration (disabled for academic-only mode)
issuer.pid.mso_mdoc.enabled=false
issuer.pid.sd_jwt_vc.enabled=false
issuer.mdl.enabled=false
issuer.learningCredential.enabled=false

# Academic Credential Configuration
issuer.academic.enabled=true
issuer.academic.sd_jwt_vc.signing-key.alias=issuance
issuer.academic.sd_jwt_vc.signing-key.password=issuance
issuer.academic.sd_jwt_vc.duration=P31D
issuer.academic.sd_jwt_vc.notifications.enabled=true
issuer.academic.sd_jwt_vc.digests.hashAlgorithm=sha-256
issuer.academic.sd_jwt_vc.proofs.supportedSigningAlgorithms=ES256
issuer.academic.institution.name=Universidad Industrial de Santander
issuer.academic.institution.country=CO
issuer.academic.institution.uri=https://www.uis.edu.co
issuer.academic.institution.nit=890203804

# Credential Offer Configuration
issuer.credentialOffer.defaultUri=eu-eaa-offer://
issuer.credentialOffer.allowedSchemes=https,eu-eaa-offer

# SD-JWT VC Type Metadata
issuer.sd-jwt-vc.type-metadata[0].vct=urn:eudi:academic:credential:1
issuer.sd-jwt-vc.type-metadata[0].resource=classpath:/vct/academic_credential.json

# DPoP Configuration
issuer.dpop.nonce.enabled=true
issuer.dpop.nonce.expiration=PT5M
issuer.dpop.realm=uis-issuer

# Batch Issuance
issuer.credentialEndpoint.batchIssuance.enabled=true
issuer.credentialEndpoint.batchIssuance.batchSize=20

# CNonce expiration
issuer.cnonce.expiration=PT5M

# Revocation Job
issuer.revocationJob.cron=0 * */8 * * *

# Preferred client status period
issuer.metadata.preferred-client-status-period=P31D

# Resource Server configuration
spring.security.oauth2.resourceserver.opaquetoken.introspection-uri=${issuer.authorizationServer.introspection}

# R2DBC Configuration for UIS Issuer database
spring.r2dbc.url=r2dbc:pool:postgresql://localhost:5433/uis_issuer
spring.r2dbc.username=uis_issuer
spring.r2dbc.password=uis_issuer

# R2DBC Configuration for UIS Academic database
issuer.uis.db.url=r2dbc:pool:postgresql://localhost:5434/uis_academic
issuer.uis.db.username=uis_academic
issuer.uis.db.password=uis_academic

# Status List Service
issuer.statusList.service.generate-uri=https://civica-desarrollo.avance.org.co/token_status_list/take
issuer.statusList.service.revoke-uri=https://civica-desarrollo.avance.org.co/token_status_list/set
issuer.statusList.service.apiKey=aaa-bbb-ccc

# Keycloak Configuration for User Data
issuer.keycloak.server-url=https://civica-desarrollo.avance.org.co/idp
issuer.keycloak.authentication-realm=master
issuer.keycloak.client-id=admin-cli
issuer.keycloak.username=admin
issuer.keycloak.password=password
issuer.keycloak.user-real=realm=uis-issuer-realm

# Access Certificate
issuer.access-certificate.alias=access-certificate
issuer.access-certificate.password=access-certificate

# Trust Configuration
issuer.trust.service-url=

# Metadata Display (Spanish)
issuer.metadata.display[0].name=Universidad Industrial de Santander
issuer.metadata.display[0].locale=es
issuer.metadata.display[0].logo.uri=https://www.uis.edu.co/logo-uis.svg
issuer.metadata.display[0].logo.alternative-text=Logo Universidad Industrial de Santander
issuer.metadata.display[1].name=UIS Academic Credentials Issuer
issuer.metadata.display[1].locale=en
issuer.metadata.display[1].logo.uri=https://www.uis.edu.co/logo-uis.svg
issuer.metadata.display[1].logo.alternative-text=UIS Academic Credentials Issuer Logo

# Persistence
spring.sql.init.mode=never
