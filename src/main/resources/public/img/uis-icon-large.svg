<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <!-- Background -->
  <rect width="400" height="120" rx="8" fill="#ffffff"/>
  
  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="120" rx="3" fill="#006837"/>
  
  <!-- Shield/Crest shape -->
  <g transform="translate(20, 15)">
    <!-- Outer shield -->
    <path d="M45 0 L90 15 L90 65 L45 90 L0 65 L0 15 Z" fill="#006837" stroke="#004d2c" stroke-width="1"/>
    <!-- Inner shield -->
    <path d="M45 8 L82 20 L82 60 L45 82 L8 60 L8 20 Z" fill="#ffffff"/>
    <!-- Gear/cog icon -->
    <circle cx="45" cy="42" r="18" fill="none" stroke="#006837" stroke-width="3"/>
    <circle cx="45" cy="42" r="8" fill="#006837"/>
    <!-- Gear teeth -->
    <rect x="42" y="22" width="6" height="8" rx="1" fill="#006837"/>
    <rect x="42" y="54" width="6" height="8" rx="1" fill="#006837"/>
    <rect x="25" y="39" width="8" height="6" rx="1" fill="#006837"/>
    <rect x="57" y="39" width="8" height="6" rx="1" fill="#006837"/>
    <!-- Diagonal teeth -->
    <rect x="28" y="26" width="6" height="6" rx="1" fill="#006837" transform="rotate(45, 31, 29)"/>
    <rect x="56" y="26" width="6" height="6" rx="1" fill="#006837" transform="rotate(-45, 59, 29)"/>
    <rect x="28" y="52" width="6" height="6" rx="1" fill="#006837" transform="rotate(-45, 31, 55)"/>
    <rect x="56" y="52" width="6" height="6" rx="1" fill="#006837" transform="rotate(45, 59, 55)"/>
    <!-- Bottom banner -->
    <rect x="15" y="68" width="60" height="14" rx="2" fill="#006837"/>
    <text x="45" y="79" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="bold">U I S</text>
  </g>
  
  <!-- Text block -->
  <g transform="translate(125, 25)">
    <!-- Main title -->
    <text x="0" y="22" font-family="Arial, sans-serif" font-size="20" fill="#006837" font-weight="bold">Universidad Industrial</text>
    <text x="0" y="46" font-family="Arial, sans-serif" font-size="20" fill="#006837" font-weight="bold">de Santander</text>
    
    <!-- Subtitle line -->
    <line x1="0" y1="55" x2="250" y2="55" stroke="#066aab" stroke-width="2"/>
    
    <!-- Subtitle -->
    <text x="0" y="72" font-family="Arial, sans-serif" font-size="11" fill="#066aab" font-weight="600">Emisor de Credenciales Académicas Digitales</text>
  </g>
</svg>
