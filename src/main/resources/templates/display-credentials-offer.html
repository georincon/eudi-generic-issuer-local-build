<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css"
          th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" type="text/css"
          th:href="@{/public/css/main.css}">
    <title th:text="#{eudiw} + ' :: ' + #{issue-credentials}">UIS :: Emitir Credenciales Académicas</title>
    <style>
        .uis-header {
            background: linear-gradient(135deg, #1a237e 0%, #0d47a1 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .uis-logo {
            max-height: 80px;
        }
        .qr-container {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            display: inline-block;
            margin: 20px 0;
        }
        .btn-uis {
            background-color: #1a237e;
            border-color: #1a237e;
        }
        .btn-uis:hover {
            background-color: #0d47a1;
            border-color: #0d47a1;
        }
        .credentials-offer-uri {
            word-break: break-all;
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
<main>
    <div class="container p-4">
        <div class="row gy-2 mb-4">
            <div class="col d-flex justify-content-start align-items-center">
                <img class="uis-logo"
                     th:src="@{/public/img/uis-logo.svg}"
                     alt="Universidad Industrial de Santander"
                     th:alt="#{institution-name}"/>
            </div>
            <div class="col d-flex justify-content-center align-items-center">
                <h2 th:text="#{issue-credentials}">Emitir Credenciales Académicas</h2>
            </div>
        </div>
        <div class="row mb-2">
            <div class="col">
                <h4 th:text="#{scan-qr-code-to-issue-credentials} + ':'">
                    Escanee el código QR generado para emitir las credenciales solicitadas:
                </h4>
            </div>
        </div>
        <div class="row mb-2">
            <div class="col d-flex justify-content-center align-content-center">
                <!--/*@thymesVar id="qrCode" type="kotlin.String"*/-->
                <!--/*@thymesVar id="qrCodeMediaType" type="kotlin.String"*/-->
                <div class="qr-container">
                    <img class="qr-code"
                         th:src="'data:' + ${qrCodeMediaType} + ';base64,' + ${qrCode}"
                         alt="QR Code"
                         th:alt="#{qr-code}"/>
                </div>
            </div>
        </div>
        <!--/*@thymesVar id="uri" type="kotlin.String"*/-->
        <div class="row mb-2 p-2">
            <div class="col d-flex justify-content-center align-content-center">
                <p>
                    <span th:text="#{alternatively-you-can-click}">Alternativamente, puede hacer clic en este</span>
                    <a rel="noopener noreferrer"
                       target="_blank"
                       href="https://www.uis.edu.co"
                       th:href="${uri}"
                       th:text="#{link}">Enlace</a>
                </p>
            </div>
        </div>
        <div class="mb-2">
            <div class="row">
                <div class="col d-flex justify-content-center align-content-center">
                    <p><span th:text="#{or-copy-the-link-below}">O copie el enlace a continuación</span></p>
                </div>
            </div>
            <div class="row">
                <div class="col d-flex justify-content-center align-content-center">
                    <code class="credentials-offer-uri" th:text="${uri}">https://www.uis.edu.co</code>
                </div>
            </div>
        </div>
        <div class="row">
            <!--/*@thymesVar id="openid4VciVersion" type="kotlin.String"*/-->
            <div class="col d-flex justify-content-start align-content-center"
                 th:unless="${#strings.isEmpty(openid4VciVersion)}">
                <p><span th:text="#{openid4vci-version(${openid4VciVersion})}">OpenId4VCI Version</span></p>
            </div>
            <div class="col d-flex justify-content-end align-content-center">
                <a class="btn btn-warning"
                   href=""
                   th:href="@{/issuer/credentialsOffer/generate}"
                   th:text="#{go-back}">Volver</a>
            </div>
        </div>
    </div>
</main>
<script type="application/javascript" th:src="@{/webjars/bootstrap/js/bootstrap.min.js}">
</script>
</body>
</html>
