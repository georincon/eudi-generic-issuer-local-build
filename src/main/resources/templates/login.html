<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css"
          th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" type="text/css"
          th:href="@{/public/css/main.css}">
    <title>UIS :: Iniciar Sesión</title>
</head>
<body class="login-body">
<main class="login-wrapper">
    <div class="login-left d-none d-md-block"
         th:style="'background-image: url(' + @{/public/img/ilustracion_background.svg} + ')'">
    </div>
    <div class="login-right">
        <div class="login-right-inner">

            <div class="text-center mb-4">
                <img class="login-logo" th:src="@{/public/img/uis_logo_v2.svg}" alt="Universidad Industrial de Santander"/>
            </div>

            <h1 class="login-title">Bienvenido al sistema</h1>
            <p class="login-subtitle">Emisor de Credenciales Académicas</p>

            <div class="alert alert-danger py-2 mt-3" role="alert" th:if="${error}">
                <span th:text="${error}">Error message</span>
            </div>

            <form id="login-form"
                  method="post"
                  enctype="application/x-www-form-urlencoded"
                  th:action="@{/issuer/login}"
                  class="mt-4">

                <div class="mb-3">
                    <label for="usuario" class="form-label">Usuario</label>
                    <div class="input-group login-input-group">
                        <span class="input-group-text login-input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="8" r="4"/>
                                <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
                            </svg>
                        </span>
                        <input class="form-control"
                               type="text"
                               name="usuario"
                               id="usuario"
                               placeholder="Digite su nombre de usuario"
                               th:value="${usuario} ?: ''"
                               required
                               autofocus>
                    </div>
                </div>

                <div class="mb-2">
                    <label for="clave" class="form-label">Contraseña</label>
                    <div class="input-group login-input-group">
                        <span class="input-group-text login-input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="5" y="11" width="14" height="9" rx="2"/>
                                <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                            </svg>
                        </span>
                        <input class="form-control"
                               type="password"
                               name="clave"
                               id="clave"
                               placeholder="Digite su contraseña"
                               required>
                        <button class="input-group-text login-input-icon login-input-icon-right" type="button" id="toggle-clave" aria-label="Mostrar contraseña">
                            <svg id="icon-eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg id="icon-eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
                                <path d="M3 3l18 18"/>
                                <path d="M10.6 10.6a3 3 0 0 0 4.24 4.24"/>
                                <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a17.6 17.6 0 0 1-3.1 3.9M6.1 6.1A17.7 17.7 0 0 0 1 11.5s4 7 11 7c1.3 0 2.5-.24 3.6-.64"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn login-btn btn-lg">
                        Iniciar sesión
                    </button>
                </div>
            </form>

            <p class="login-footer-note">
                Universidad Industrial de Santander &middot; Emisor de Credenciales Académicas EUDI
            </p>
        </div>
    </div>
</main>

<script type="application/javascript" th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
<script>
    document.getElementById('toggle-clave').addEventListener('click', function () {
        var input = document.getElementById('clave');
        var open = document.getElementById('icon-eye-open');
        var closed = document.getElementById('icon-eye-closed');
        var isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        open.style.display = isPassword ? 'none' : 'block';
        closed.style.display = isPassword ? 'block' : 'none';
    });
</script>
</body>
</html>
